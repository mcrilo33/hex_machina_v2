name: "simple_greeting_task"
description: "A simple task to generate greeting datasets for testing"
dataset: true

steps:
  - name: "generate_greeting"
    runnable: "PromptTemplate"
    dataset: true
    config:
      template: "Generate a greeting for {name}. Make it {style}."
      input_variables: ["name", "style"]
  
  - name: "llm_response"
    runnable: "ChatOpenAI"
    dataset: true
    config:
      temperature: 0.7
      model: "gpt-3.5-turbo"

