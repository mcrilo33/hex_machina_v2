name: "greeting_quality_experiments"
description: "Comprehensive experiments to evaluate greeting quality across different criteria"

# Define the existing datasets to experiment on
target_datasets:
  - "simple_greeting_task_generate_greeting_20250813_090059"
  - "simple_greeting_task_llm_response_20250813_090115"
  - "simple_greeting_task_task_20250813_090055"

# Define experiment configurations
experiments:
  helpfulness_evaluation:
    name: "helpfulness_experiment"
    description: "Evaluate the helpfulness of responses using length-based scoring"
    evaluators:
      - name: "helpfulness_scorer"
        type: "custom_function"
        description: "Scores helpfulness based on response length and content"
        parameters:
          min_length_threshold: 50
          max_length_threshold: 200
          length_weight: 0.7
          content_weight: 0.3

  conciseness_evaluation:
    name: "conciseness_experiment"
    description: "Evaluate the conciseness of responses"
    evaluators:
      - name: "conciseness_scorer"
        type: "custom_function"
        description: "Scores conciseness - shorter responses get higher scores"
        parameters:
          optimal_length: 100
          length_tolerance: 50
          max_score_length: 150

  combined_evaluation:
    name: "combined_quality_experiment"
    description: "Evaluate both helpfulness and conciseness for balanced scoring"
    evaluators:
      - name: "helpfulness_scorer"
        type: "custom_function"
        description: "Scores helpfulness based on response length"
        parameters:
          min_length_threshold: 50
          max_length_threshold: 200
      - name: "conciseness_scorer"
        type: "custom_function"
        description: "Scores conciseness - shorter responses get higher scores"
        parameters:
          optimal_length: 100
          length_tolerance: 50

  advanced_evaluation:
    name: "advanced_quality_experiment"
    description: "Advanced evaluation with multiple criteria and weights"
    evaluators:
      - name: "helpfulness_scorer"
        type: "custom_function"
        description: "Enhanced helpfulness scoring"
        parameters:
          min_length_threshold: 50
          max_length_threshold: 200
          length_weight: 0.6
          content_weight: 0.4
          bonus_for_details: true
      - name: "conciseness_scorer"
        type: "custom_function"
        description: "Enhanced conciseness scoring"
        parameters:
          optimal_length: 100
          length_tolerance: 50
          max_score_length: 150
          penalty_for_verbosity: true
      - name: "relevance_scorer"
        type: "custom_function"
        description: "Scores relevance to the input context"
        parameters:
          context_keywords: ["name", "style"]
          keyword_weight: 0.8
          context_weight: 0.2

# Global experiment settings
settings:
  experiment_prefix: "yaml_configured"
  save_results: true
  metadata:
    project: "hex_machina_v2"
    evaluation_type: "yaml_configured_experiments"
    version: "1.0.0"

