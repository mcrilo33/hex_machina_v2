name: ArticleIsCompleteTask
description: "Task to check if an article is complete"
steps:
  - name: fetch_articles
    runnable: ArticleFetcher
    config:
      db_path: "storage/articles14.db"
      filters:
        limit: 1
    dataset: false

  - name: prompt_template
    runnable: PromptTemplate
    config:
      prompt_name: "article_completeness"
    dataset: true

  - name: llm_processor
    runnable: ChatOpenAI
    config:
      model: "gpt-3.5-turbo"
      temperature: 0.0
      max_tokens: 4000
    dataset: true

  - name: save_keywords_enrichment
    runnable: EnrichmentSaver
    config:
      db_path: "storage/articles14.db"
      enrichment_type: "keywords"
      input_mapping: "llm_processor.content"
    dataset: false

metadata:
  category: "example"
  tags:
    - "example_task"
