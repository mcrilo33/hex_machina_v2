name: ContentQualityTask
description: "Task to check if the content is of high quality"
steps:
  - name: fetch_articles
    runnable: ArticleFetcher
    config:
      db_path: "storage/articles14.db"
      filters:
        limit: 1000000

  - name: prompt_template
    runnable: PromptTemplate
    config:
      prompt_name: "content_quality"

  - name: llm_processor
    runnable: ChatOpenAI
    config:
      model: "google/gemini-2.5-flash"
      temperature: 0.0
      #max_tokens: 4000
      base_url: "https://openrouter.ai/api/v1"
      api_key: "${OPENROUTER_API_KEY}"
datasets:
  - name: "content_quality"
    description: "Dataset for evaluating the content quality"
    input_step: "prompt_template"
    output_step: "llm_processor"

metadata:
  category: "article_is_complete"
  tags:
    - "article_is_complete"
