name: ExampleTask
description: "Example task configuration for CLI demonstration with ArticleFetcher and EnrichmentSaver"
steps:
  - name: fetch_articles
    runnable: ArticleFetcher
    config:
      db_path: "storage/articles14.db"
      filters:
        limit: 5

  - name: prompt_template
    runnable: PromptTemplate
    config:
      template: "Extract keywords from the following text: {text_content}"

  - name: llm_processor
    runnable: ChatOpenAI
    config:
      model: "gpt-3.5-turbo"
      temperature: 0.0
      max_tokens: 4000

  - name: save_keywords_enrichment
    runnable: EnrichmentSaver
    config:
      db_path: "storage/articles14.db"
      enrichment_type: "keywords"
      input_mapping: "llm_processor.content"
datasets:
  - name: "llm_keywords"
    description: "Dataset for evaluating the keyword extraction pipeline"
    input_step: "prompt_template"
    output_step: "llm_processor"
    input_mapping: "prompt_template.messages"
    output_mapping: "llm_processor.content"

metadata:
  category: "example"
  tags:
    - "example_task"
