# Simple Test Experiment
# This experiment tests basic configurations for demonstration

experiment_name: "simple_test"
description: "Simple test experiment for demonstration"
created_at: "2025-08-07"

# Dataset to use for evaluation
evaluation_dataset: "test-workflow-dataset-v2"
# evaluation_split: "train"  # Commented out to use all examples

# Evaluators to use for comparison
evaluators:
  - criteria_completeness
  - criteria_accuracy

# Task configurations to test (simplified for demo)
task_configs:
  - name: "baseline"
    description: "Current configuration"
    config:
      model: "openai/gpt-4o-mini"
      temperature: 0
      max_tokens: 1000
      prompt_template: "current"
  
  - name: "high_temp"
    description: "Higher temperature for creativity"
    config:
      model: "openai/gpt-4o-mini"
      temperature: 0.3
      max_tokens: 1000
      prompt_template: "current"

# Comparison metrics
comparison_metrics:
  primary: "criteria_completeness"
  secondary: ["criteria_accuracy"]
  threshold: 0.8

# Experiment settings
settings:
  max_concurrent_runs: 2
  timeout_per_run: 300
  save_intermediate_results: true
