name: ContentCompletenessLangChainTask
version: "1.0.0"
description: "Content completeness evaluation task using LangChain"
task_type: evaluation

# LLM settings
llm_provider: openrouter
llm_model: anthropic/claude-3.5-sonnet
temperature: 0.0
max_tokens: 1000
timeout: 30

# Prompt settings
prompt_template: content_completeness
prompt_variables: null

# Output settings
output_parser: CompletenessOutputParser

# Metadata
metadata:
  category: evaluation
  tags:
    - content-quality
    - completeness
    - langchain
  author: "Hex Machina v2"
  created_date: "2025-01-27" 