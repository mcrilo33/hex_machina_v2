name: ArticleIsCompleteTestExp
description: "Article is complete test experiment"

target_dataset: "ArticleIsCompleteTask_article_completeness_20250814_171430"

# Specify which dataset splits to use for evaluation
# Can be a single split name or list of splits
split: ["small"]

# Task specification directly in experiment
task:
  name: "ArticleIsCompleteTask"
  steps:
    - name: prompt_template
      runnable: PromptTemplate
      config:
        prompt_name: "article_completeness"

    - name: llm_processor
      runnable: ChatOpenAI
      config:
        model: "google/gemini-2.5-flash"
        temperature: 0.0
        max_tokens: 4000
        base_url: "https://openrouter.ai/api/v1"
        api_key: "${OPENROUTER_API_KEY}"

# All evaluators evaluate the complete task execution
evaluators:
  - name: criteria_accuracy
    type: "criteria"
    description: "Evaluate if the LLM output is accurate"
    config:
      criteria: ["accuracy"]
      threshold: 0.8
      model: "openai/gpt-4o-mini"
      base_url: "https://openrouter.ai/api/v1"
      api_key: "${OPENROUTER_API_KEY}"
      temperature: 0.0

  - name: content_completeness
    type: "content_completeness"
    description: "Evaluate if the extracted keywords are complete"
    config:
      model: "openai/gpt-4o-mini"
      base_url: "https://openrouter.ai/api/v1"
      api_key: "${OPENROUTER_API_KEY}"
      temperature: 0.0

  - name: keyword_quality
    type: "keyword_extraction_quality"
    description: "Evaluate the quality of extracted keywords"
    config:
      model: "anthropic/claude-3-5-sonnet"
      base_url: "https://openrouter.ai/api/v1"
      api_key: "${OPENROUTER_API_KEY}"
      temperature: 0.1

metadata:
  category: "example"
  tags:
    - "example_experiment"
