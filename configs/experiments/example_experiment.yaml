name: example_experiment
description: "Example experiment configuration for CLI demonstration"

# Single target dataset - inputs from first step, outputs from last step
target_dataset: "ExampleTask_llm_keywords_20250814_145420"

# Task specification directly in experiment
task:
  name: "ExampleTask"
  steps:
    - name: prompt_template
      runnable: PromptTemplate
      config:
        template: "Extract keywords from the following text: {text_content}"
        input_variables: ["text_content"]

    - name: llm_processor
      runnable: ChatOpenAI
      config:
        model: "gpt-3.5-turbo"
        temperature: 0.0
        max_tokens: 4000

# All evaluators evaluate the complete task execution
evaluators:
  - name: criteria_accuracy
    type: "criteria"
    description: "Evaluate if the LLM output is accurate"
    config:
      criteria: ["accuracy"]
      threshold: 0.8
      model: "gpt-4o-mini"
      temperature: 0.0

  - name: content_completeness
    type: "content_completeness"
    description: "Evaluate if the extracted keywords are complete"
    config:
      model: "gpt-4o-mini"
      temperature: 0.0

  - name: keyword_quality
    type: "keyword_extraction_quality"
    description: "Evaluate the quality of extracted keywords"
    config:
      model: "anthropic/claude-3-5-sonnet"
      temperature: 0.1

metadata:
  category: "example"
  tags:
    - "example_experiment"
