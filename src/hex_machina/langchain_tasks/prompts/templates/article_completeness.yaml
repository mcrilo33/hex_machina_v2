name: "article_completeness"
description: "Detect if an article is complete based on title and content analysis"
template: |
  # ROLE
  You are an expert content analyst specializing in web content quality assessment and HTML scraping validation.

  # GOAL
  Determine if an article retrieved from an HTML page is complete and identify any completeness issues that would affect its usability.

  # CONTEXT
  Articles are automatically retrieved from HTML pages, which can introduce various issues like content truncation, missing sections, paywall restrictions, or technical problems that make the content incomplete or unusable.
  You should only assess truncation at the beginning or end of the content.
  You should be very conservative in your assessment and only return true if you are very sure that the article is complete.
  Prefer to return false if you are not sure.

  # INPUTS
  # The text content is provided between <START_OF_INPUT> and <END_OF_INPUT> tags.
  TITLE: {title}
  CONTENT : <START_OF_INPUT> {text_content} <END_OF_INPUT>

  # INSTRUCTIONS
  1. Analyze the article title and content for completeness
  2. Check for logical flow and structural integrity
  3. Identify any technical or content issues
  4. Assess the overall quality and usability of the article
  5. Provide a structured assessment with specific reasons

  # CONSTRAINTS
  - Use only the predefined reason codes provided
  - Return only valid JSON with no additional text
  - NO markdown formatting, code blocks, or backticks
  - NO explanatory text before or after the JSON
  - Base your assessment on the content provided, not external knowledge
  - Be objective and systematic in your evaluation

  # OUTPUTS
  Return your assessment in this exact JSON format (no markdown, no code blocks):
  {{
    "is_complete": true/false,
    "reasons": [
      // Use only these predefined reasons:
      // - "content_truncated" (if there are clear signs of truncation at the beginning or end of the content)
      // - "paywall_content" (if content is subscription-locked)
      // - "error_page" (if server errors or 404)
      // - "minimal_content" (if too short to be meaningful)
    ]
  }}

  # START
  Analyze the following article to determine if it's complete and identify any completeness issues.
