name: "content_completeness"
version: "1.0.0"
description: "Evaluate content completeness for articles"

template: |
  Evaluate if the following article content is complete and comprehensive.
  
  Article: {content}
  
  Provide your evaluation in JSON format with the following structure:
  {
    "is_complete": boolean,
    "issues": [list of issues if any],
    "confidence": "low|medium|high",
    "reasoning": "explanation of your assessment"
  }
  
  Consider the following criteria:
  - Content length and depth
  - Completeness of information
  - Quality of writing
  - Relevance to the topic
  - Presence of missing or truncated content

variables: ["content"]

metadata:
  author: "Hex Machina"
  created_at: "2025-01-15"
  tags: ["evaluation", "content", "completeness"] 