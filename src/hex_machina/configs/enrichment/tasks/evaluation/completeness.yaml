name: "content_completeness"
version: "1.0.0"
description: "Content completeness evaluation task for articles"
task_type: "evaluation"

# LLM Configuration
llm_provider: "openrouter"
llm_model: "anthropic/claude-3.5-sonnet"
temperature: 0.0
max_tokens: 1000
timeout: 30

# Task-specific configuration
metadata:
  task_category: "evaluation"
  task_subcategory: "content_quality"
  supported_inputs: ["article"]
  output_format: "json"
  
# Prompt configuration
prompt:
  template: "evaluation/completeness"
  variables:
    - "title"
    - "content"
  

  
# Output validation
output_validation:
  required_fields:
    - "is_complete"
    - "detected_issues"
  
  detected_issues_allowed_values:
    - "anti_bot_page"
    - "subscription_wall" 
    - "truncated_content"
    - "error_page"
    - "not_an_article"
    - "list_of_articles" 