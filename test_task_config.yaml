name: "simple_hello_task"
description: "A simple task that uses a prompt template and LLM to generate a greeting"
steps:
  - name: "generate_greeting"
    runnable: "PromptTemplate"
    dataset: true
    config:
      template: "Generate a friendly greeting for someone named {name}. Make it creative and warm."
  
  - name: "llm_response"
    runnable: "ChatOpenAI"
    dataset: true
    config:
      model: "gpt-3.5-turbo"
      temperature: 0.7
      max_tokens: 100

global_config: {}

metadata:
  task_type: "greeting_generation"
  version: "1.0"

dataset: true
