name: "llm_article_processing_experiments"
description: "Test experiments with different LLM configurations and evaluate results"

# Task configuration with multiple values (will generate variations)
task:
  name: "test_llm_article_processing"
  description: "LLM article processing with different parameters"
  steps:
    - name: "fetch_sample_articles"
      runnable: "ArticleFetcher"
      dataset: false  # Disabled step-level dataset generation
      config:
        db_path: "storage/articles14.db"
        filters:
          limit: 2  # Just get 2 articles to test with
    
    - name: "generate_article_summary"
      runnable: "PromptTemplate"
      dataset: false  # Enabled step-level dataset generation
      config:
        # Multiple values = multiple task variations
        template: [
          "Summarize this article in one sentence: {title}\n\n{text_content}",
        ]
        input_variables: ["title", "text_content"]
    
    - name: "llm_response"
      runnable: "ChatOpenAI"
      dataset: false # Enabled
      config:
        # Multiple values = multiple task variations
        temperature: [0.1]
        model: ["gpt-3.5-turbo"]
        max_tokens: [4000]
    
    - name: "save_summaries"
      runnable: "EnrichmentSaver"
      dataset: false  # Disabled step-level dataset generation
      config:
        db_path: "storage/articles14.db"
        enrichment_type: "llm_summary"
        input_mapping: "llm_response" # Changed to use llm_response output

# Evaluation configuration with target datasets
evaluations:
  # Step-level evaluations
  steps:
    generate_article_summary:
      target_datasets:
        - "test_llm_article_processing_generate_article_summary_20250813_132918"
      evaluators:
        - name: "relevance_evaluator"
          type: "criteria:relevance"
          description: "Evaluate relevance of generated summaries"
          parameters:
            llm:
              model: "gpt-3.5-turbo"
              temperature: 0.0
        
        - name: "completeness_evaluator"
          type: "criteria:completeness"
          description: "Evaluate completeness of generated summaries"
          parameters:
            llm:
              model: "gpt-3.5-turbo"
              temperature: 0.0
        
        - name: "conciseness_evaluator"
          type: "criteria:conciseness"
          description: "Evaluate conciseness of generated summaries"
          parameters:
            llm:
              model: "gpt-3.5-turbo"
              temperature: 0.0
    
    llm_response:
      target_datasets:
        - "test_llm_article_processing_llm_response_20250813_132922"
      evaluators:
        - name: "accuracy_evaluator"
          type: "criteria:accuracy"
          description: "Evaluate accuracy of LLM responses"
          parameters:
            llm:
              model: "gpt-3.5-turbo"
              temperature: 0.0
        
        - name: "helpfulness_evaluator"
          type: "criteria:helpfulness"
          description: "Evaluate helpfulness of LLM responses"
          parameters:
            llm:
              model: "gpt-3.5-turbo"
              temperature: 0.0

# Global experiment settings
settings:
  experiment_prefix: "llm_article_processing"
  save_results: true
  metadata:
    project: "hex_machina_v2"
    evaluation_type: "llm_optimization"
    domain: "article_processing"
    version: "1.0.0"
    tags: ["llm", "evaluation", "experiments", "article_summarization"]
