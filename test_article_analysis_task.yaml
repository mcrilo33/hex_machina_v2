task:
  name: "article_analysis"
  
  steps:
    - name: "fetch_articles"
      runnable: "ArticleFetcher"
      config:
        db_path: "data/hex_machina.db"
        filters:
          domain: "techcrunch.com"
          date_range: "last_7_days"
          limit: 10
    
    - name: "extract_keywords"
      runnable: "KeywordExtractor"
      dataset: true
    
    - name: "save_keywords"
      runnable: "EnrichmentSaver"
      config:
        db_path: "data/hex_machina.db"
        enrichment_type: "keywords"
        input_mapping: "extract_keywords.keywords"
    
    - name: "summarize_content"
      runnable: "ContentSummarizer"
      dataset: true
    
    - name: "save_summary"
      runnable: "EnrichmentSaver"
      config:
        db_path: "data/hex_machina.db"
        enrichment_type: "summary"
        input_mapping: "summarize_content.summary"
