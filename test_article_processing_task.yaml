name: "test_llm_article_processing"
dataset: true  # Enable task-level dataset generation

steps:
  - name: "fetch_sample_articles"
    runnable: "ArticleFetcher"
    dataset: false  # Disable step-level dataset generation
    config:
      db_path: "storage/articles14.db"
      filters:
        limit: 2  # Just get 2 articles to test with
  
  - name: "generate_article_summary"
    runnable: "PromptTemplate"
    dataset: true  # Enable step-level dataset generation
    config:
      template: "Summarize this article in one sentence: {title}\n\n{text_content}"
      input_variables: ["title", "text_content"]

  - name: "llm_response"
    runnable: "ChatOpenAI"
    dataset: true  # Enable step-level dataset generation
    config:
      model: "gpt-3.5-turbo"
      temperature: 0.1
      max_tokens: 4000
  
  - name: "save_summaries"
    runnable: "EnrichmentSaver"
    dataset: false  # Disable step-level dataset generation
    config:
      db_path: "storage/articles14.db"
      enrichment_type: "llm_summary"
      input_mapping: "llm_response"  # Changed to use llm_response output

metadata:
  task_type: "llm_article_processing"
  version: "1.0"
