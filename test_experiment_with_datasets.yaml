name: "greeting_quality_experiment"
description: "Test greeting generation with different temperature and model parameters using existing datasets"

# Base task configuration (will generate variations)
task:
  name: "greeting_task_variations"
  steps:
    - name: "generate_greeting"
      runnable: "PromptTemplate"
      dataset: true
      config:
        template: "Generate a greeting for {name}. Make it {style}."
        input_variables: ["name", "style"]
    
    - name: "llm_response"
      runnable: "ChatOpenAI"
      dataset: true
      config:
        # Multiple values for this step = multiple experiments
        temperature: [0.1, 0.7, 1.0]
        model: ["gpt-4", "gpt-3.5-turbo"]

# Evaluation configuration (offline, post-execution)
evaluations:
  steps:
    generate_greeting:
      - name: "criteria:helpfulness"
        hyperparameters:
          temperature: 0.1
    
    llm_response:
      - name: "criteria:helpfulness"
        hyperparameters:
          temperature: 0.1
      
      - name: "criteria:conciseness"
        hyperparameters:
          temperature: 0.1
  
  task:
    - name: "criteria:helpfulness"
      hyperparameters:
        temperature: 0.1
